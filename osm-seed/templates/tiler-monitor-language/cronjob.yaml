{{- if .Values.tilerMonitorLanguage.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-tiler-monitor-language
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-monitor-language
    release: {{ .Release.Name }}
spec:
  schedule: {{ .Values.tilerMonitorLanguage.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Single run; the schedule provides periodicity (no while loop).
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.tilerMonitorLanguage.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app: {{ template "osm-seed.name" . }}
            release: {{ .Release.Name }}
            run: {{ .Release.Name }}-tiler-monitor-language
        spec:
          serviceAccountName: {{ .Release.Name }}-tiler-monitor-language
          restartPolicy: Never
          containers:
            - name: {{ .Chart.Name }}-tiler-monitor-language
              image: "{{ .Values.tilerMonitorLanguage.image.name }}:{{ .Values.tilerMonitorLanguage.image.tag }}"
              env:
                # Targets derived from the release name
                - name: K8S_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: IMPOSM_STATEFULSET
                  value: {{ .Release.Name }}-tiler-imposm-sts
                - name: MARTIN_DEPLOYMENT
                  value: {{ .Release.Name }}-tiler-server-martin
                {{- range $key, $value := .Values.tilerMonitorLanguage.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              envFrom:
              # POSTGRES_* for the tiler DB
              - configMapRef:
                  name: {{ .Release.Name }}-tiler-db-cm
                  optional: true
              {{- if .Values.tilerMonitorLanguage.resources.enabled }}
              resources:
                requests:
                  memory: {{ .Values.tilerMonitorLanguage.resources.requests.memory }}
                  cpu: {{ .Values.tilerMonitorLanguage.resources.requests.cpu }}
                limits:
                  memory: {{ .Values.tilerMonitorLanguage.resources.limits.memory }}
                  cpu: {{ .Values.tilerMonitorLanguage.resources.limits.cpu }}
              {{- end }}
          {{- if .Values.tilerMonitorLanguage.nodeSelector.enabled }}
          nodeSelector:
            {{ .Values.tilerMonitorLanguage.nodeSelector.label_key }} : {{ .Values.tilerMonitorLanguage.nodeSelector.label_value }}
          {{- end }}
{{- end }}
