{{- if (.Values.nominatimApi.ingress | default dict).enabled }}
{{- /* Toggle with nominatimApi.ingress.enabled. Set nominatimApi.ingress.{className,annotations,hosts,tls}.
       className falls back to the global ingressClassName. */ -}}
{{- $ing := .Values.nominatimApi.ingress -}}
{{- $primary := .Values.nominatimApi.ingressDomain | default (printf "nominatim-api.%s" .Values.domain) -}}
{{- $hosts := $ing.hosts | default (list $primary) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "osm-seed.fullname" . }}-ingress-nominatim-api
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.className | default .Values.ingressClassName }}
  {{- if ($ing.tls | default dict).enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ ($ing.tls | default dict).secretName | default (printf "%s-secret-nominatim" (include "osm-seed.fullname" .)) }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        {{- if $.Values.nominatimUI.enabled }}
        paths:
        # Routes to the API
        - path: /((?:search|reverse|lookup|status|deletable|polygons|details)(?:\.php)?)
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ $.Release.Name }}-nominatim-api
              port:
                number: 80
        # Fallback route for static UI
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ $.Release.Name }}-nominatim-ui
              port:
                number: 80
        {{- else }}
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ $.Release.Name }}-nominatim-api
              port:
                number: 80
        {{- end }}
    {{- end }}
{{- end }}
