{{- if .Values.web.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service-web
  labels:
    app: {{ template "osm-seed.name" . }}
    component: web-service
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
  annotations:
    # NLB
    {{- if and  (eq .Values.ingressClassNameType "nlb" ) (eq .Values.serviceType "ClusterIP") }}
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "300"
    cert-manager.io/cluster-issuer: {{ .Release.Name }}-letsencrypt-prod-issuer
    {{- end }}

spec:
  type: {{ .Values.serviceType }}
  selector:
    app: {{ template "osm-seed.name" . }}
    release: {{ .Release.Name }}
    run: {{ .Release.Name }}-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    {{- if and (eq .Values.ingressClassNameType "nlb") .Values.AWS_SSL_ARN }}
    - name: https
      port: 443
      targetPort: http
      protocol: TCP
    {{- end }}
{{- end }}
