{{- if .Values.web.ingress.enabled }}
{{- /* Toggle with web.ingress.enabled. Set web.ingress.{className,annotations,hosts,tls}.
       className falls back to the global ingressClassName. hosts default to
       web/api/apex of domain. Pass any controller's annotations verbatim. */ -}}
{{- $ing := .Values.web.ingress -}}
{{- $primary := .Values.web.ingressDomain | default (printf "web.%s" .Values.domain) -}}
{{- $hosts := $ing.hosts | default (list $primary (printf "api.%s" .Values.domain) .Values.domain) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress-web
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.className | default .Values.ingressClassName }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ $ing.tls.secretName | default (printf "%s-tls-secret" .Release.Name) }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-service-web
                port:
                  number: 80
    {{- end }}
{{- end }}
