{{- if .Values.tilerDb.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-tiler-db
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-db
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: {{ .Release.Name }}-tiler-db
    release: {{ .Release.Name }}
    run: {{ .Release.Name }}-tiler-db
{{- end }}
