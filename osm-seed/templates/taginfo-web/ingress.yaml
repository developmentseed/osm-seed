{{- if and .Values.taginfoWeb.enabled (eq .Values.serviceType "ClusterIP") .Values.ingressClassName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "osm-seed.fullname" . }}-ingress-taginfo-api
  annotations:
    ## NLB 
    {{- if eq .Values.ingressClassNameType "nlb" }}
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: {{ .Release.Name }}-letsencrypt-prod-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    {{- end }}
    # ALB
    {{- if eq .Values.ingressClassNameType "alb" }}
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: {{ .Release.Name }}
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip" 
    alb.ingress.kubernetes.io/listen-ports: '{{ .Values.alb.listenPorts | default "[{\"HTTP\":80},{\"HTTPS\":443}]" }}'
    alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.alb.certificateArn }}"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Enable WAF
    {{- if .Values.alb.enableWaf.enabled }}
    alb.ingress.kubernetes.io/waf-acl-arn: "{{ .Values.alb.enableWaf.wafAclArn }}"
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  {{- if eq .Values.ingressClassNameType "nlb" }}
  tls:
  - hosts:
    {{- if .Values.taginfoWeb.ingressDomain }}
    - {{ .Values.taginfoWeb.ingressDomain }}
    {{- else }}
    - taginfo.{{ .Values.domain }}
    {{- end }}
    secretName: {{ template "osm-seed.fullname" . }}-secret-taginfo
  {{- end }}
  rules:
  - host: {{ if .Values.taginfoWeb.ingressDomain }}{{ .Values.taginfoWeb.ingressDomain }}{{ else }}taginfo.{{ .Values.domain }}{{ end }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ template "osm-seed.fullname" . }}-taginfo
            port:
              number: 80
{{- end }}
