{{- if .Values.osmxAdiffBuilder.enabled -}}
{{- if .Values.osmxAdiffBuilder.persistenceDisk.enabled -}}

############## k3s static hostPath PV (fixed dir = data identity, reusable across releases) ##############
{{- if and (eq .Values.cloudProvider "k3s") .Values.osmxAdiffBuilder.persistenceDisk.staticHostPath }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-osmx-adiff-builder-pv
  labels:
    app: {{ template "osm-seed.name" . }}
    component: osmx-adiff-builder-pv
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: {{ .Values.osmxAdiffBuilder.persistenceDisk.localVolumeSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.osmxAdiffBuilder.persistenceDisk.localVolumeHostPath | quote }}
    type: DirectoryOrCreate
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-osmx-adiff-builder-pv-claim
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: {{ template "osm-seed.name" . }}
    component: osmx-adiff-builder-pvc
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  ############## k3s ##############
  {{- if eq .Values.cloudProvider "k3s" }}
  {{- if .Values.osmxAdiffBuilder.persistenceDisk.staticHostPath }}
  storageClassName: ""
  volumeName: {{ .Release.Name }}-osmx-adiff-builder-pv
  {{- else }}
  storageClassName: local-path
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.osmxAdiffBuilder.persistenceDisk.localVolumeSize }}
  {{- else }}
  ############## Other providers ##############
  {{- if .Values.osmxAdiffBuilder.persistenceDisk.storageClassName }}
  storageClassName: {{ .Values.osmxAdiffBuilder.persistenceDisk.storageClassName | quote }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.osmxAdiffBuilder.persistenceDisk.size }}
  {{- end }}
{{- end }}
{{- end }}
