{{- if .Values.osmchaApi.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-osmcha-api
  labels:
    app: {{ template "osm-seed.name" . }}
    component: osmcha-api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.osmchaApi.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-osmcha-api
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-osmcha-api
    spec:
      initContainers:
      - name: osmcha-init
        image: "{{ .Values.osmchaApi.image.name }}:{{ .Values.osmchaApi.image.tag }}"
        command:
          - /bin/sh
          - -c
          - python manage.py migrate
          - python manage.py collectstatic --noinput
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-osmcha-api-env
        volumeMounts:
        - name: staticfiles
          mountPath: /app/staticfiles
      priorityClassName: {{ .Release.Name }}-{{ .Values.osmchaApi.priorityClass | default "medium-priority" }}
      containers:
      - name: osmcha-api
        image: "{{ .Values.osmchaApi.image.name }}:{{ .Values.osmchaApi.image.tag }}"
        args: ["gunicorn", "config.wsgi", "-b", "0.0.0.0:5000", "--access-logfile", "-", "--timeout", "120", "--workers", "4", "--threads", "16"]
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 5000
          initialDelaySeconds: 60
          timeoutSeconds: 30
          
        volumeMounts:
        - name: staticfiles
          mountPath: /staticfiles
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-osmcha-api-env
        {{- include "osm-seed.resources" .Values.osmchaApi | nindent 8 }}

      - name: frontend-nginx
        image: "{{ .Values.osmchaWeb.image.name }}:{{ .Values.osmchaWeb.image.tag }}"
        ports:
        - containerPort: 80
        env:
        - name: BACKEND_URL
          value: http://localhost:5000
        volumeMounts:
          - name: staticfiles
            mountPath: /srv/www/static/django
            readOnly: true
      - name: osmcha-redis
        image: "redis:latest"
        ports:
        - containerPort: 6379
      volumes:
        - name: staticfiles
          emptyDir: {}
      {{- include "osm-seed.nodeSelector" .Values.osmchaApi | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.osmchaApi | nindent 6 }}
{{- end }}

