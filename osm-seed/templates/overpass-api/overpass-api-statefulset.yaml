{{- if .Values.overpassApi.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-overpass-api
  labels:
    app: {{ template "osm-seed.name" . }}
    component: overpass-api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-overpass-api
  serviceName: {{ .Release.Name }}-overpass-api
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-overpass-api
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.overpassApi.priorityClass | default "medium-priority" }}
      containers:
        - name: {{ .Chart.Name }}-overpass-api
          image: "{{ .Values.overpassApi.image.name }}:{{ .Values.overpassApi.image.tag }}"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 14400 # Normal update takes 2 hours aprrox, afther that start checking liveness 
            timeoutSeconds: 30
          {{- include "osm-seed.resources" .Values.overpassApi | nindent 10 }}
          env:
            {{- range $k, $v := .Values.overpassApi.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
          - mountPath: /db
            name: overpass-api-storage
          {{- include "osm-seed.resources" .Values.overpassApi | nindent 10 }}
      restartPolicy: Always
      volumes:
        - name: overpass-api-storage
        {{- if .Values.overpassApi.persistenceDisk.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-overpass-api-data
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- include "osm-seed.nodeSelector" .Values.overpassApi | nindent 6 }}
      # Affinity settings
      {{- if .Values.overpassApi.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.overpassApi.nodeAffinity.key }}
                    operator: In
                    values:
                    {{- range .Values.overpassApi.nodeAffinity.values }}
                      - {{ . | quote }}
                    {{- end }}
      {{- end }}
{{- end }}
