{{- if (.Values.overpassApi.ingress | default dict).enabled }}
{{- /* Toggle with overpassApi.ingress.enabled. Set overpassApi.ingress.{className,annotations,hosts,tls}.
       className falls back to the global ingressClassName. */ -}}
{{- $ing := .Values.overpassApi.ingress -}}
{{- $primary := .Values.overpassApi.ingressDomain | default (printf "overpass-api.%s" .Values.domain) -}}
{{- $hosts := $ing.hosts | default (list $primary) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "osm-seed.fullname" . }}-ingress-overpass-api
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.className | default .Values.ingressClassName }}
  {{- if ($ing.tls | default dict).enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ ($ing.tls | default dict).secretName | default (printf "%s-secret-overpass" (include "osm-seed.fullname" .)) }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-overpass-api
                port:
                  number: 80
    {{- end }}
{{- end }}
