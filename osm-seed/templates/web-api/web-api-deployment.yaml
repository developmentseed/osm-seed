{{- if .Values.webApi.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-api
  labels:
    app: {{ template "osm-seed.name" . }}
    component: web-api-deployment
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.webApi.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-web-api
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-web-api
    spec:
      {{- if .Values.webApi.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.webApi.serviceAccount.name }}
      automountServiceAccountToken: true
      {{- end }}
      priorityClassName: {{ .Release.Name }}-{{ .Values.webApi.priorityClass | default "high-priority" }}
      containers:
        - name: {{ .Chart.Name }}-web-api
          image: "{{ .Values.webApi.image.name }}:{{ .Values.webApi.image.tag }}"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            {{- if .Values.webApi.livenessProbeExec }}
            exec:
              command:
              - /bin/bash
              - -c
              - ./liveness.sh
            initialDelaySeconds: 120
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 5
            successThreshold: 1
            {{- else }}
            httpGet:
              path: /api/0.6/capabilities
              port: 80
            initialDelaySeconds: 600 # 10 min, because the compile process takes time.
            timeoutSeconds: 30
            {{- end }}
          {{- if and .Values.webApi.resources.enabled (or .Values.webApi.resources.requests.enabled .Values.webApi.resources.limits.enabled) }}
          resources:
            {{- if .Values.webApi.resources.requests.enabled }}
            requests:
              memory: {{ .Values.webApi.resources.requests.memory }}
              cpu: {{ .Values.webApi.resources.requests.cpu }}
            {{- end }}
            {{- if .Values.webApi.resources.limits.enabled }}
            limits:
              memory: {{ .Values.webApi.resources.limits.memory }}
              cpu: {{ .Values.webApi.resources.limits.cpu }}
            {{- end }}
          {{- end }}
          env:
            # ---- Computed / cluster-specific (not plain web.env pass-throughs) ----
            - name: GET_HOSTS_FROM
              value: dns
            - name: POSTGRES_HOST
              value: {{ .Release.Name }}-web-db
            - name: POSTGRES_DB
              value: {{ .Values.webDb.env.POSTGRES_DB }}
            - name: POSTGRES_PASSWORD
              value: {{ quote .Values.webDb.env.POSTGRES_PASSWORD }}
            - name: POSTGRES_USER
              value: {{ .Values.webDb.env.POSTGRES_USER }}
            - name: OPENSTREETMAP_memcache_servers
              value: {{ .Release.Name }}-memcached:11211
            # cgimap always runs as its own pod (external)
            - name: EXTERNAL_CGIMAP
              value: "true"
            - name: CGIMAP_URL
              value: {{ .Release.Name }}-cgimap-service
            - name: CGIMAP_PORT
              value: {{ quote 80 }}
            # ---- Everything else passes straight through from web.env ----
            {{- range $k, $v := .Values.webApi.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - mountPath: /dev/shm
              name: shared-memory
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.webApi.sharedMemorySize }}
          name: shared-memory
      {{- if .Values.webApi.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.webApi.nodeSelector.label_key }} : {{ .Values.webApi.nodeSelector.label_value }}
      {{- end }}
      # Node affinity
      {{- if .Values.webApi.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.webApi.nodeAffinity.key }}
                    operator: In
                    values:
                    {{- range .Values.webApi.nodeAffinity.values }}
                      - {{ . | quote }}
                    {{- end }}
        # Pod anti-affinity, to set that no two pods are scheduled on the same node
        {{- if .Values.webApi.podAntiAffinity.enabled }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ template "osm-seed.name" . }}
                  release: {{ .Release.Name }}
                  run: {{ .Release.Name }}-web-api
              topologyKey: "kubernetes.io/hostname"
        {{- end }}
      {{- end }}
{{- end }}
