{{- if .Values.tmApi.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-tm-api
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tm-api
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
  {{- with .Values.tmApi.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.serviceType }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ template "osm-seed.name" . }}
    release: {{ .Release.Name }}
    run: {{ .Release.Name }}-tm-api
{{- end }}
