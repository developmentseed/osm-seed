{{- if .Values.tilerMonitorPipeline.enabled -}}
{{- if .Values.tilerMonitorPipeline.persistenceDisk.enabled -}}

############## k3s: dynamic local-path (no PV) OR static hostPath when staticHostPath=true ##############
{{- if or (ne .Values.cloudProvider "k3s") (and (eq .Values.cloudProvider "k3s") .Values.tilerMonitorPipeline.persistenceDisk.staticHostPath) }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-tiler-monitor-pipeline-pv
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-monitor-pipeline-pd
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  ############## AWS Provider ##############
  {{- if eq .Values.cloudProvider "aws" }}
  storageClassName: ""
  capacity:
    storage: {{ .Values.tilerMonitorPipeline.persistenceDisk.AWS_ElasticBlockStore_size }}
  accessModes:
    - ReadWriteOnce
  awsElasticBlockStore:
    volumeID: {{ .Values.tilerMonitorPipeline.persistenceDisk.AWS_ElasticBlockStore_volumeID }}
    fsType: ext4
  {{- end }}

  ############## k3s static hostPath (fixed dir = data identity, reusable across releases) ##############
  {{- if and (eq .Values.cloudProvider "k3s") .Values.tilerMonitorPipeline.persistenceDisk.staticHostPath }}
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: {{ .Values.tilerMonitorPipeline.persistenceDisk.localVolumeSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.tilerMonitorPipeline.persistenceDisk.localVolumeHostPath | quote }}
    type: DirectoryOrCreate
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-tiler-monitor-pipeline-pv-claim
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-monitor-pipeline-pd
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  ############## k3s ##############
  {{- if eq .Values.cloudProvider "k3s" }}
  {{- if .Values.tilerMonitorPipeline.persistenceDisk.staticHostPath }}
  storageClassName: ""
  volumeName: {{ .Release.Name }}-tiler-monitor-pipeline-pv
  {{- else }}
  storageClassName: local-path
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.tilerMonitorPipeline.persistenceDisk.localVolumeSize }}
  {{- else }}
  ############## Other providers ##############
  storageClassName: ""
  volumeName: {{ .Release.Name }}-tiler-monitor-pipeline-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      ############## AWS Provider ##############
      {{- if eq .Values.cloudProvider "aws" }}
      storage: {{ .Values.tilerMonitorPipeline.persistenceDisk.AWS_ElasticBlockStore_size }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
