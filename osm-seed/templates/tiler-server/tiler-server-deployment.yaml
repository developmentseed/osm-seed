{{- if .Values.tilerServer.enabled }}
{{ if eq .Values.tilerServer.env.TILER_CACHE_TYPE "s3" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tiler-server
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-server
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.tilerServer.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-tiler-server
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-tiler-server
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.tilerServer.priorityClass | default "medium-priority" }}
      {{- include "osm-seed.serviceAccount" .Values.tilerServer | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}-tiler-server
          image: "{{ .Values.tilerServer.image.name }}:{{ .Values.tilerServer.image.tag }}"
          command: [ {{ .Values.tilerServer.command }} ]
          ports:
            - name: http
              containerPort: {{ .Values.tilerServer.env.TILER_SERVER_PORT }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.tilerServer.env.TILER_SERVER_PORT }}
            initialDelaySeconds: 1000
            timeoutSeconds: 30
          {{- include "osm-seed.resources" .Values.tilerServer | nindent 10 }}
          envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-tiler-server-env
          - configMapRef:
              name: {{ .Release.Name }}-tiler-db-env
      {{- include "osm-seed.nodeSelector" .Values.tilerServer | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.tilerServer | nindent 6 }}
{{- end }}
{{- end }}
