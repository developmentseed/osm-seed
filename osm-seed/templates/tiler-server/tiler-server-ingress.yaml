{{- if and .Values.tilerServer.enabled (eq .Values.serviceType "ClusterIP") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress-tiler-server
  annotations:
    ## NLB 
    {{- if eq .Values.ingressClassNameType "nlb" }}
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: {{ .Release.Name }}-letsencrypt-prod-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    {{- end }}
    # ALB
    {{- if eq .Values.ingressClassNameType "alb" }}
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: {{ .Release.Name }}
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip" 
    alb.ingress.kubernetes.io/listen-ports: '{{ .Values.alb.listenPorts | default "[{\"HTTP\":80},{\"HTTPS\":443}]" }}'
    alb.ingress.kubernetes.io/certificate-arn: "{{ .Values.alb.certificateArn }}"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # Enable WAF
    {{- if .Values.alb.enableWaf.enabled }}
    alb.ingress.kubernetes.io/waf-acl-arn: "{{ .Values.alb.enableWaf.wafAclArn }}"
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  {{- if eq .Values.ingressClassNameType "nlb" }}
  tls:
    - hosts:
        {{- if .Values.tilerServer.ingressDomain }}
        - {{ .Values.tilerServer.ingressDomain }}
        {{- else }}
        - tiler.{{ .Values.domain }}
        {{- end }}
      secretName: {{ .Release.Name }}-secret-tiler-server
  {{- end }}
  rules:
    - host: {{ if .Values.tilerServer.ingressDomain }}{{ .Values.tilerServer.ingressDomain }}{{ else }}tiler.{{ .Values.domain }}{{ end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-tiler-server
                port:
                  number: 80
{{- end }}
