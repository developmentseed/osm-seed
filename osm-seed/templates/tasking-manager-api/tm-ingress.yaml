{{- if and .Values.tmApi.enabled .Values.tmApi.ingress.enabled }}
{{- $ing := .Values.tmApi.ingress -}}
{{- $hosts := $ing.hosts -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress-tm-api
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.className | default .Values.ingressClassName }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ $ing.tls.secretName | default (printf "%s-secret-tm-api" .Release.Name) }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-tasking-manager-api
                port:
                  number: 80
    {{- end }}
{{- end }}
