{{- if .Values.osmchaApi.ingress.enabled }}
{{- $ing := .Values.osmchaApi.ingress -}}
{{- $primary := .Values.osmchaApi.ingressDomain | default (printf "osmcha.%s" .Values.domain) -}}
{{- $hosts := $ing.hosts | default (list $primary) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "osm-seed.fullname" . }}-ingress-osmcha-app
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $ing.className | default .Values.ingressClassName }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ $ing.tls.secretName | default (printf "%s-secret-osmcha" (include "osm-seed.fullname" .)) }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "osm-seed.fullname" $ }}-osmcha-app
                port:
                  number: 80
    {{- end }}
{{- end }}
