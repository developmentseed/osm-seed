{{- if .Values.tilerServerMartin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tiler-server-martin
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-server-martin
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.tilerServerMartin.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ template "osm-seed.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-tiler-server-martin
  template:
    metadata:
      labels:
        app: {{ template "osm-seed.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-tiler-server-martin
    spec:
      priorityClassName: {{ .Release.Name }}-{{ .Values.tilerServerMartin.priorityClass | default "medium-priority" }}
      containers:
        - name: {{ .Chart.Name }}-tiler-server-martin
          image: "{{ .Values.tilerServerMartin.image.name }}:{{ .Values.tilerServerMartin.image.tag }}"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            {{- range $k, $v := .Values.tilerServerMartin.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-tiler-db-env
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          {{- include "osm-seed.resources" .Values.tilerServerMartin | nindent 10 }}
      {{- include "osm-seed.nodeSelector" .Values.tilerServerMartin | nindent 6 }}
      {{- include "osm-seed.nodeAffinity" .Values.tilerServerMartin | nindent 6 }}
{{- end }}
