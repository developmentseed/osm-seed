{{- if .Values.tilerServerMartin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-tiler-server-martin
  labels:
    app: {{ template "osm-seed.name" . }}
    component: tiler-server-martin
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.serviceType }}
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app: {{ template "osm-seed.name" . }}
    release: {{ .Release.Name }}
    run: {{ .Release.Name }}-tiler-server-martin
{{- end }}
