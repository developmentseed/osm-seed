    OSMX_INITIAL_SEQNUM: "0"
    AWS_S3_BUCKET: s3://planet.openhistoricalmap.org
  persistenceDisk:
    enabled: true
    mountPath: /data
    size: 50Gi
    storageClassName: ""
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    staticHostPath: true
    localVolumeHostPath: /mnt/osmx-adiff-data
    localVolumeSize: 50Gi
  resources:
    enabled: false
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"
