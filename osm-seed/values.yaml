    label_key: nodegroup_type
    label_value: web
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]

# ====================================================================================================
# Variables for tiler-imposm
# ====================================================================================================
tilerImposm:
  enabled: false
  image:
    name: ""
    tag: ""
  serviceAccount:
    enabled: true
    name: ohm-web-s3-bucket-access-staging
  priorityClass: "medium-priority"
  env:
    TILER_IMPORT_FROM: osm
    TILER_IMPORT_PBF_URL: http://download.geofabrik.de/europe/monaco-latest.osm.pbf
    REPLICATION_URL: http://download.geofabrik.de/europe/monaco-updates/
    SEQUENCE_NUMBER: "0"
    OVERWRITE_STATE: false
    UPLOAD_EXPIRED_FILES: true
    IMPORT_NATURAL_EARTH: true
    IMPORT_OSM_LAND: true
    IMPOSM3_IMPORT_LAYERS: all
    # Refresh/recreate materialized views during replication updates
    REFRESH_MVIEWS: false
    RECREATE_MVIEWS_ON_UPDATE: false
    # Upload of expired-tiles files needs CLOUDPROVIDER set (aws|gcp) + bucket/creds.
    # If CLOUDPROVIDER is unset the upload is skipped.
    CLOUDPROVIDER: aws
    AWS_S3_BUCKET: ""
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
  persistenceDisk:
    enabled: false
    accessMode: ReadWriteOnce
    mountPath: /mnt/data
    # k3s: staticHostPath=true uses a fixed hostPath dir (reusable across releases); false = dynamic local-path
    staticHostPath: false
    localVolumeHostPath: /mnt/tiler-imposm-data
    localVolumeSize: 10Gi
    # AWS
    AWS_ElasticBlockStore_volumeID: vol-1234bcd
    AWS_ElasticBlockStore_size: 50Gi
  resources:
    enabled: false
    requests:
      enabled: false
      memory: "1Gi"
      cpu: "2"
    limits:
      enabled: false
      memory: "2Gi"
      cpu: "2"
  nodeSelector:
    enabled: false
    label_key: nodegroup_type
    label_value: web
  nodeAffinity:
    enabled: false
    key: "nodegroup_type"
    values: ["web"]
