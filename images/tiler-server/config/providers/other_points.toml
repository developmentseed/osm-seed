# Layer configuration for other points
[[providers.layers]]
name = "other_points"
geometry_fieldname = "geometry"
geometry_type = "point"
id_fieldname = "id"
sql = """
SELECT 
    ST_AsMVTGeom(geometry, !BBOX!) AS geometry, 
    id, 
    osm_id, 
    name, 
    class, 
    type, 
    tags->'artwork_type' AS artwork_type, 
    tags->'site_type' AS site_type
FROM 
    osm_other_points 
WHERE 
    geometry && !BBOX!
"""
