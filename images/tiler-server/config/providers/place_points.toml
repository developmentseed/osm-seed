# Layer configuration for place points
[[providers.layers]]
name = "place_points"
geometry_fieldname = "geometry"
geometry_type = "point"
id_fieldname = "id"
sql = """
SELECT 
    ST_AsMVTGeom(geometry, !BBOX!) AS geometry, 
    id, 
    osm_id, 
    name, 
    type,
    tags->'capital' AS capital 
FROM 
    osm_place_points 
WHERE 
    geometry && !BBOX!
"""
