# Layer configuration for landuse points
[[providers.layers]]
name = "landuse_points"
geometry_fieldname = "geometry"
geometry_type = "point"
id_fieldname = "id"
sql = """
SELECT 
    ST_AsMVTGeom(geometry, !BBOX!) AS geometry, 
    id, 
    osm_id, 
    name, 
    class, 
    type
FROM 
    osm_landuse_points 
WHERE 
    geometry && !BBOX!
"""
