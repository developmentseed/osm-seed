# Layer configuration for place areas
[[providers.layers]]
name = "place_areas"
geometry_fieldname = "geometry"
geometry_type = "multipolygon"
id_fieldname = "id"
sql = """
SELECT 
    ST_AsMVTGeom(geometry, !BBOX!) AS geometry, 
    id, 
    osm_id, 
    name, 
    type
FROM 
    osm_place_areas 
WHERE 
    geometry && !BBOX!
"""
