[[providers.layers]]
name = "other_areas_6-8"
geometry_fieldname = "geometry"
geometry_type = "multipolygon"
id_fieldname = "id"
sql = """
SELECT 
    ST_AsMVTGeom(geometry, !BBOX!) AS geometry, 
    id, 
    osm_id, 
    name, 
    class, 
    type
FROM 
    osm_other_areas 
WHERE 
    area > 1000000
    AND geometry && !BBOX!
"""

