name: Chartpress Publish
on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'optimize_build_images'
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GHCR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup git
      run: |
        git config --global user.email "noreply@osm-seed.org"
        git config --global user.name "Github Action"

    - name: Install dependencies
      run: pip install chartpress==2.3.0 yq

    - name: Set env vars
      run: |
        GIT_BRANCH_NAME=${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}
        GIT_BRANCH_NAME=${GIT_BRANCH_NAME/\//_}
        OSM_SEED_VERSION=$(yq -r .appVersion ./osm-seed/Chart.yaml)
        echo "GIT_BRANCH_NAME=$GIT_BRANCH_NAME" >> $GITHUB_ENV
        echo "OSM_SEED_VERSION=$OSM_SEED_VERSION" >> $GITHUB_ENV

    - name: Run Chartpress
      env:
        GITHUB_TOKEN: ${{ secrets.GHCR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        # Chartpress automatically detects changes via git and only builds/pushes what's needed
        # With fetch-depth: 0, it can see the full git history to determine which images changed
        chartpress --push --publish-chart --builder docker-buildx

