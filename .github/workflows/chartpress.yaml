name: Chartpress Publish
on:
  push:
    branches:
      - 'main'
      - 'develop'
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GHCR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Fetch full git history for chartpress to detect changes correctly

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup git
      run: git config --global user.email "noreply@osm-seed.org" && git config --global user.name "Github Action"

    - name: Install Chartpress and some python modules
      run: |
        pip install chartpress==2.3.0 six yq

    - name: Set env vars for publish charts
      run: |
        GIT_BRANCH_NAME=${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}
        GIT_BRANCH_NAME=${GIT_BRANCH_NAME/\//_}
        OSM_SEED_VERSION=$(yq -r .appVersion ./osm-seed/Chart.yaml)
        SHORT_GITHUB_SHA=${GITHUB_SHA::7}
        echo "GIT_BRANCH_NAME=$GIT_BRANCH_NAME" >> $GITHUB_ENV
        echo "OSM_SEED_VERSION=$OSM_SEED_VERSION" >> $GITHUB_ENV
        echo "SHORT_GITHUB_SHA=$SHORT_GITHUB_SHA" >> $GITHUB_ENV

    - name: Run Chartpress
      env:
        GITHUB_TOKEN: ${{ secrets.GHCR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        chartpress --push --publish-chart
