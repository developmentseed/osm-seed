services:
  # #####################################################
  # ## Taginfo section
  # #####################################################
  taginfo:
    image: osmseed-taginfo:v1
    build:
      context: ../images/taginfo
      dockerfile: Dockerfile
    ports:
      - '8001:80'
    volumes:
      - ../data/taginfo-data:/usr/src/app/data
      - ../images/taginfo/start.sh:/usr/src/app/start.sh
    command: >
      /bin/bash -c "/usr/src/app/start.sh web"

    env_file:
      - ../envs/.env.taginfo
